services:
  postgres:
    image: postgres:16
    container_name: spark_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: spark_user
      POSTGRES_PASSWORD: spark_password
      POSTGRES_DB: spark_db
    ports:
      - "5432:5432"
    volumes:
      - spark_postgres_data:/var/lib/postgresql/data

volumes:
  spark_postgres_data:
